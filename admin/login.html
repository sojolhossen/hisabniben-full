<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - HisabNiben</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #f97316;
            --primary-light: #fb923c;
            --primary-dark: #ea580c;
            --secondary: #6366f1;
            --accent: #8b5cf6;
            --dark: #0f172a;
            --darker: #020617;
            --surface: rgba(15, 23, 42, 0.7);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --success: #22c55e;
            --error: #ef4444;
        }

        body {
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            background: var(--darker);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated Background Canvas */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Floating Shapes */
        .shape {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            opacity: 0.6;
            animation: float-shape 25s infinite ease-in-out;
        }

        .shape-1 {
            width: 600px;
            height: 600px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            top: -200px;
            right: -200px;
            animation-delay: 0s;
        }

        .shape-2 {
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, var(--secondary), #a855f7);
            bottom: -150px;
            left: -150px;
            animation-delay: -8s;
        }

        .shape-3 {
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, var(--accent), #ec4899);
            top: 40%;
            left: 60%;
            animation-delay: -16s;
        }

        @keyframes float-shape {
            0%, 100% { transform: translate(0, 0) scale(1) rotate(0deg); }
            25% { transform: translate(80px, -50px) scale(1.1) rotate(90deg); }
            50% { transform: translate(-40px, 30px) scale(0.95) rotate(180deg); }
            75% { transform: translate(60px, 60px) scale(1.05) rotate(270deg); }
        }

        /* Glass Container */
        .container {
            position: relative;
            z-index: 10;
            width: min(480px, 90%);
            animation: fade-in-up 0.8s ease-out;
        }

        @keyframes fade-in-up {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Login Card */
        .login-card {
            background: linear-gradient(145deg,
                rgba(255,255,255,0.08) 0%,
                rgba(255,255,255,0.03) 100%);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 32px;
            padding: 48px 40px;
            position: relative;
            backdrop-filter: blur(40px);
            box-shadow:
                0 32px 80px rgba(0,0,0,0.4),
                inset 0 1px 0 rgba(255,255,255,0.1);
            overflow: hidden;
        }

        /* Shimmer Border Effect */
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg,
                transparent,
                var(--primary),
                var(--primary-light),
                var(--secondary),
                transparent);
            background-size: 200% 100%;
            animation: border-shimmer 3s linear infinite;
        }

        @keyframes border-shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        /* Glow Effect */
        .login-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(249,115,22,0.1) 0%, transparent 50%);
            animation: glow-rotate 20s linear infinite;
            pointer-events: none;
        }

        @keyframes glow-rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Logo Section */
        .logo-section {
            text-align: center;
            margin-bottom: 36px;
            position: relative;
            z-index: 1;
        }

        .logo-ring {
            width: 100px;
            height: 100px;
            margin: 0 auto 24px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid transparent;
        }

        .ring-1 {
            width: 100%;
            height: 100%;
            border-top-color: var(--primary);
            border-right-color: var(--primary-light);
            animation: spin 4s linear infinite;
        }

        .ring-2 {
            width: 85%;
            height: 85%;
            border-bottom-color: var(--secondary);
            border-left-color: var(--accent);
            animation: spin-reverse 5s linear infinite;
        }

        .ring-3 {
            width: 70%;
            height: 70%;
            border: 1px solid rgba(255,255,255,0.2);
            animation: pulse-glow 2s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes spin-reverse {
            to { transform: rotate(-360deg); }
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(249,115,22,0.3); }
            50% { box-shadow: 0 0 40px rgba(249,115,22,0.5); }
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 16px 40px rgba(249,115,22,0.35);
            animation: icon-float 3s ease-in-out infinite;
        }

        @keyframes icon-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .logo-icon i {
            font-size: 28px;
            color: white;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        .logo-section h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
        }

        .logo-section p {
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 400;
        }

        /* Error Message */
        .error-message {
            display: none;
            margin-bottom: 20px;
            padding: 14px 18px;
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.3);
            border-radius: 14px;
            color: #fecaca;
            font-size: 0.9rem;
            align-items: center;
            gap: 10px;
            animation: shake-error 0.5s ease;
            backdrop-filter: blur(10px);
        }

        .error-message.show {
            display: flex;
        }

        .error-message i {
            color: var(--error);
            font-size: 1.1rem;
        }

        @keyframes shake-error {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        /* Form */
        .form-container {
            position: relative;
            z-index: 1;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .form-group label i {
            color: var(--primary);
            font-size: 0.9rem;
        }

        .input-box {
            position: relative;
        }

        .form-input {
            width: 100%;
            padding: 16px 50px 16px 18px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            color: var(--text);
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-input::placeholder {
            color: rgba(148,163,184,0.4);
        }

        .form-input:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(249,115,22,0.3);
        }

        .form-input:focus {
            background: rgba(255,255,255,0.1);
            border-color: var(--primary);
            box-shadow:
                0 0 0 4px rgba(249,115,22,0.1),
                0 8px 24px rgba(249,115,22,0.1);
        }

        .input-icon {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .form-input:focus ~ .input-icon {
            color: var(--primary);
            transform: translateY(-50%) scale(1.1);
        }

        .password-toggle {
            cursor: pointer;
            padding: 8px;
            right: 10px;
        }

        .password-toggle:hover {
            color: var(--primary);
        }

        /* Options */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 24px 0;
            padding: 0 4px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            user-select: none;
            color: var(--text-muted);
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .remember-me:hover {
            color: var(--text);
        }

        .remember-me input {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            background: transparent;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
        }

        .remember-me input:hover {
            border-color: var(--primary);
        }

        .remember-me input:checked {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-color: var(--primary);
        }

        .remember-me input:checked::after {
            content: '\f00c';
            font-family: 'Font Awesome 6 Free';
            font-weight: 700;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 0.65rem;
        }

        .forgot-link {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-decoration: none;
            position: relative;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .forgot-link:hover {
            color: var(--primary);
        }

        .forgot-link::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            transition: width 0.3s ease;
        }

        .forgot-link:hover::after {
            width: 100%;
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            padding: 18px 28px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            font-size: 1.05rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 32px rgba(249,115,22,0.35);
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 200%;
            height: 100%;
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(255,255,255,0.3) 50%,
                transparent 100%);
            transition: left 0.8s ease;
        }

        .submit-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 16px 48px rgba(249,115,22,0.45);
        }

        .submit-btn:hover::before {
            left: 100%;
        }

        .submit-btn:active {
            transform: translateY(-1px) scale(1);
        }

        .submit-btn.loading {
            pointer-events: none;
            opacity: 0.8;
        }

        .submit-btn.loading .btn-content {
            opacity: 0;
        }

        .submit-btn.loading .spinner {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .btn-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: opacity 0.3s ease;
        }

        .btn-content i {
            font-size: 1.1rem;
        }

        .spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .submit-btn.success {
            background: linear-gradient(135deg, var(--success), #16a34a);
            box-shadow: 0 8px 32px rgba(34,197,94,0.35);
        }

        .submit-btn.shake {
            animation: btn-shake 0.5s ease;
        }

        @keyframes btn-shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        /* Footer */
        .login-footer {
            margin-top: 28px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            position: relative;
            z-index: 1;
        }

        .login-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .login-footer a:hover {
            color: var(--primary-light);
        }

        /* Back Button */
        .back-btn {
            position: fixed;
            top: 24px;
            left: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            z-index: 100;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(249,115,22,0.3);
            color: var(--text);
            transform: translateX(-3px);
        }

        .back-btn i {
            font-size: 0.9rem;
            transition: transform 0.3s ease;
        }

        .back-btn:hover i {
            transform: translateX(-3px);
        }

        /* Particles Canvas */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px;
                border-radius: 24px;
            }

            .logo-section h1 {
                font-size: 1.8rem;
            }

            .logo-ring {
                width: 80px;
                height: 80px;
            }

            .logo-icon {
                width: 50px;
                height: 50px;
            }

            .back-btn {
                top: 16px;
                left: 16px;
                padding: 10px 16px;
            }

            .back-btn span {
                display: none;
            }
        }

        /* Success Checkmark Animation */
        .checkmark {
            display: none;
            animation: check-pop 0.5s ease;
        }

        .submit-btn.success .checkmark {
            display: inline-block;
        }

        .submit-btn.success .btn-content i:not(.checkmark) {
            display: none;
        }

        @keyframes check-pop {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <!-- Particle Canvas -->
    <canvas id="particles-canvas"></canvas>

    <!-- Animated Background Shapes -->
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>

    <!-- Back Button -->
    <a href="../index.html" class="back-btn">
        <i class="fas fa-arrow-left"></i>
        <span>Back to Home</span>
    </a>

    <!-- Main Container -->
    <div class="container">
        <div class="login-card">
            <!-- Logo Section -->
            <div class="logo-section">
                <div class="logo-ring">
                    <div class="ring ring-1"></div>
                    <div class="ring ring-2"></div>
                    <div class="ring ring-3"></div>
                    <div class="logo-icon">
                        <i class="fas fa-calculator"></i>
                    </div>
                </div>
                <h1>Welcome Back</h1>
                <p>Sign in to manage your business</p>
            </div>

            <!-- Error Message -->
            <div id="error-message" class="error-message">
                <i class="fas fa-exclamation-circle"></i>
                <span id="error-text"></span>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="form-container">
                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i>
                        Email or Phone
                    </label>
                    <div class="input-box">
                        <input
                            type="text"
                            id="email"
                            class="form-input"
                            placeholder="admin@email.com or 01XXXXXXXXX"
                            required
                            autocomplete="username"
                        >
                        <i class="fas fa-user input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i>
                        Password
                    </label>
                    <div class="input-box">
                        <input
                            type="password"
                            id="password"
                            class="form-input"
                            placeholder="Enter your password"
                            required
                            autocomplete="current-password"
                        >
                        <span class="input-icon password-toggle" onclick="togglePassword()">
                            <i class="fas fa-eye" id="toggle-icon"></i>
                        </span>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember-me">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" id="submit-btn" class="submit-btn">
                    <span class="btn-content">
                        <span>Sign In</span>
                        <i class="fas fa-arrow-right"></i>
                        <i class="fas fa-check checkmark"></i>
                    </span>
                    <span class="spinner"></span>
                </button>
            </form>

            <!-- Footer -->
            <div class="login-footer">
                <span>HisabNiben</span> &copy; 2024. Crafted with <i class="fas fa-heart" style="color: var(--error); margin: 0 4px;"></i> for you
            </div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="config/config.js"></script>
    <script src="js/firebase.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>

    <script>
        // Particle System
        class ParticleSystem {
            constructor() {
                this.canvas = document.getElementById('particles-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.particles = [];
                this.resize();
                this.init();
                this.animate();
                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            init() {
                for (let i = 0; i < 50; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        vx: (Math.random() - 0.5) * 0.5,
                        vy: (Math.random() - 0.5) * 0.5,
                        size: Math.random() * 3 + 1,
                        opacity: Math.random() * 0.5 + 0.2
                    });
                }
            }

            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                this.particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;

                    if (p.x < 0 || p.x > this.canvas.width) p.vx *= -1;
                    if (p.y < 0 || p.y > this.canvas.height) p.vy *= -1;

                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    this.ctx.fillStyle = `rgba(249, 115, 22, ${p.opacity})`;
                    this.ctx.fill();
                });

                // Draw connections
                this.particles.forEach((p1, i) => {
                    this.particles.slice(i + 1).forEach(p2 => {
                        const dx = p1.x - p2.x;
                        const dy = p1.y - p2.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < 150) {
                            this.ctx.beginPath();
                            this.ctx.moveTo(p1.x, p1.y);
                            this.ctx.lineTo(p2.x, p2.y);
                            this.ctx.strokeStyle = `rgba(249, 115, 22, ${0.1 * (1 - dist / 150)})`;
                            this.ctx.lineWidth = 1;
                            this.ctx.stroke();
                        }
                    });
                });

                requestAnimationFrame(() => this.animate());
            }
        }

        new ParticleSystem();

        // Toggle Password
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('toggle-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        // Login Handler
        document.addEventListener('DOMContentLoaded', async () => {
            await Auth.redirectIfLoggedIn();

            const form = document.getElementById('login-form');
            const btn = document.getElementById('submit-btn');
            const error = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');
            const email = document.getElementById('email');
            const password = document.getElementById('password');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                btn.classList.add('loading');
                btn.disabled = true;
                error.classList.remove('show');

                const result = await Auth.login(email.value.trim(), password.value);

                if (result.success) {
                    btn.classList.add('success');
                    btn.querySelector('.btn-content span').textContent = 'Success!';
                    setTimeout(() => window.location.href = 'index.html', 1000);
                } else {
                    errorText.textContent = result.error;
                    error.classList.add('show');
                    btn.classList.remove('loading');
                    btn.disabled = false;
                    btn.classList.add('shake');
                    setTimeout(() => btn.classList.remove('shake'), 500);
                }
            });
        });
    </script>
</body>
</html>
